<script>
/* ============================================================
   ADD YOUR DESIGN WORK HERE
   Put image files in an "images" folder next to this page,
   then reference them below.
   ============================================================ */
const DESIGN_WORK = [
  { title: "Promo Poster",   tag: "AP hogeschool",  img: "Screenshot 2026-08-30 231825.png" },
  { title: "Instagram Carousel",   tag: "AP social Media", img: "2526_S1_EK2_QuinteroGoyesD_Carrousel.jpg" },
  { title: "Kleur illustratie", tag: "monotoon",     img: "Screenshot 2026-08-30 231723.png" },
  { title: "Promotie mail",  tag: "The barn", img: "Schermafbeelding 2026-04-23 062044.png" },
  { title: "Instagram Carousel One", tag: "Carousel", images: ["2526_S2_Groep14_P1_Instagramtemplate.jpg", "2526_S2_Groep14_P1_Instagramtemplate2.jpg", "2526_S2_Groep14_P1_Instagramtemplate3.jpg","2526_S2_Groep14_P1_Instagramtemplate4.jpg", "2526_S2_Groep14_P1_Instagramtemplate5.jpg"] },


];
 
const workGrid = document.getElementById('workGrid');
DESIGN_WORK.forEach(item => {
  const images = item.images || [item.img];   // always work with an array internally
  const card = document.createElement('div');
  card.className = 'work-card';
  card.innerHTML = `
    <div class="thumb">
      ${images.length > 1 ? `<span class="carousel-badge">1 / ${images.length}</span>` : ''}
      <img src="${images[0]}" alt="${item.title}" loading="lazy">
    </div>
    <div class="info"><div class="tag">${item.tag}</div><h3>${item.title}</h3></div>
  `;
  card.addEventListener('click', () => openLightbox(images, item.title));
  workGrid.appendChild(card);
});
 

/* ============================================================
   Lightbox: click a card -> big image (or carousel) over a
   dark overlay. Close via the X, clicking the overlay, or Escape.
   Multi-image cards get < > arrows and a counter.
   ============================================================ */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxPrev = document.getElementById('lightboxPrev');
const lightboxNext = document.getElementById('lightboxNext');
const lightboxCounter = document.getElementById('lightboxCounter');
 
let currentImages = [];
let currentIndex = 0;
let currentTitle = '';
 
function openLightbox(images, title){
  currentImages = images;
  currentIndex = 0;
  currentTitle = title;
  lightbox.classList.toggle('multi', images.length > 1);
  showImage();
  lightbox.classList.add('active');
}
function showImage(){
  lightboxImg.src = currentImages[currentIndex];
  lightboxImg.alt = currentTitle;
  lightboxCounter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
}
function nextImage(){ currentIndex = (currentIndex + 1) % currentImages.length; showImage(); }
function prevImage(){ currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length; showImage(); }
function closeLightbox(){
  lightbox.classList.remove('active');
  lightboxImg.src = '';
}
 
lightboxClose.addEventListener('click', closeLightbox);
lightboxNext.addEventListener('click', nextImage);
lightboxPrev.addEventListener('click', prevImage);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox(); // click on the dark overlay itself, not the image
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') nextImage();
  if (e.key === 'ArrowLeft') prevImage();
});
</script>
<script src="script.js"></script>
</body>
