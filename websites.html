<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Websites — Daniela's Portfolio</title>
<link rel="stylesheet" href="https://use.typekit.net/ygl4jfm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="banner">
  <div class="brand">Daniela's Portfolio</div>
  <div class="tagline">Graphic &amp; Motion Designer</div>
  <div class="menu-container">
    <a class="menu-item" href="index.html">Home</a>
    <a class="menu-item" href="animation.html">Videos</a>
    <a class="menu-item" href="design.html">Design</a>
    <a class="menu-item active" href="websites.html">Websites</a>
  </div>
</div>

<section class="page-hero">
  <div class="eyebrow">03 — Web</div>
  <h1>Websites</h1>
  <p>Sites I've designed and built. Click through to see them live.</p>
</section>

<section class="section">
  <div class="site-grid" id="siteGrid"></div>
</section>

<footer>
  <span>© <span id="year"></span> Daniela</span>
  <span>you@example.com</span>
</footer>

<script>
/* ============================================================
   ADD YOUR WEBSITE PROJECTS HERE
   "img" is a screenshot of the site — put it in the "images" folder.
   "url" is the live link (opens in a new tab).
   ============================================================ */
const SITES = [
  { title: "Site One",   tag: "Portfolio",  img: "images/site-1.jpg", url: "https://example.com", desc: "Short one-line description of the project." },
  { title: "Site Two",   tag: "Small Biz",  img: "images/site-2.jpg", url: "https://example.com", desc: "Short one-line description of the project." },
  { title: "Site Three", tag: "Landing Page", img: "images/site-3.jpg", url: "https://example.com", desc: "Short one-line description of the project." },
];

const siteGrid = document.getElementById('siteGrid');
SITES.forEach(s => {
  const card = document.createElement('a');
  card.className = 'site-card';
  card.href = s.url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';
  card.innerHTML = `
    <div class="thumb"><img src="${s.img}" alt="${s.title}" loading="lazy"></div>
    <div class="info">
      <div class="tag">${s.tag}</div>
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <span class="visit">Visit site ↗</span>
    </div>
  `;
  siteGrid.appendChild(card);
});
</script>
<script src="script.js"></script>
</body>
</html>
