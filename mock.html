  <div class="menu-container">

<section class="page-hero">
  <div class="eyebrow">02 — Graphic Design</div>
  <h1>Design work</h1>
  <p>Branding, print, and editorial pieces.</p>
</section>

<section class="section">
  <div class="work-grid" id="workGrid"></div>
</section>

<footer>
  <span>© <span id="year"></span> Daniela</span>

</footer>

<script>
/* ============================================================
   ADD YOUR DESIGN WORK HERE
   Put image files in an "images" folder next to this page,
   then reference them below.
   ============================================================ */
const DESIGN_WORK = [
  { title: "Project One",   tag: "Branding",  img: "2526_S1_EK2_QuinteroGoyesD_opdracht-raamsticker-simulatie.jpg" },
  { title: "Project Two",   tag: "Editorial", img: "2526_S2_QuinteroGoyesD_P1POS.jpg" },
  { title: "Project Three", tag: "Print",     img: "heheh.jpg" },
  { title: "Project Four",  tag: "Packaging", img: "mockupp.jpg" },

];

const workGrid = document.getElementById('workGrid');
DESIGN_WORK.forEach(item => {
  const card = document.createElement('div');
  card.className = 'work-card';
  card.innerHTML = `
    <div class="thumb"><img src="${item.img}" alt="${item.title}" loading="lazy"></div>
    <div class="info"><div class="tag">${item.tag}</div><h3>${item.title}</h3></div>
  `;
  workGrid.appendChild(card);
});
</script>
<script src="script.js"></script>
</body>
